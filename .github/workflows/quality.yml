name: Quality gates
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.21.3 --no-audit --no-fund
      - run: npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:legacy
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.21.3 --no-audit --no-fund
      - run: npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - name: Show formatting diff on failure
        if: failure()
        run: |
          npm run format
          git diff -- src/controllers/app.mjs tests/e2e/routine.spec.mjs
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.21.3 --no-audit --no-fund
      - run: npm --version
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
